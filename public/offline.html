<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1117" />
    <title>Rally — offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; padding: 1.5rem; box-sizing: border-box;
             background: #0e1117; color: #e8edf4; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      main { max-width: 22rem; }
      .eyebrow { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #e8c84a; margin: 0 0 0.6rem; }
      h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 2rem; line-height: 1.15; margin: 0 0 0.9rem; font-weight: 400; }
      p { color: #8b949e; line-height: 1.6; margin: 0 0 1.5rem; }
      button { font: inherit; font-weight: 600; background: #e8c84a; color: #0e1117; border: 0; border-radius: 6px; padding: 0.7rem 1.5rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Rally</p>
      <h1>You're offline</h1>
      <p>Rally needs a connection to show live standings and report scores. Check your signal or Wi-Fi, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
